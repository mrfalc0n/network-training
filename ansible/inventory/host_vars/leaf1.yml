---
# leaf1 — AS 65001, Loopback0 10.0.0.1
# Fill in values from labs/02-underlay/README.md (addressing plan).
bgp_asn: 65001
loopback_ip: 10.0.0.1

# fabric_links: one entry per uplink (one per spine).
# local_ip includes the prefix length (/31). remote_ip is the peer's address (no mask).
fabric_links:
  - interface: Ethernet1
    description: spine1-Eth1        # which node is on the other end?
    local_ip: 10.1.0.1/31
    remote_ip: 10.1.0.0
    remote_asn: 65000
  - interface: Ethernet2
    description: spine2-Eth2
    local_ip: 10.1.0.9/31
    remote_ip: 10.1.0.8
    remote_asn: 65005
