---
# Phase 2/3 underlay fabric — 2 spine × 4 leaf.
#
# ansible_host: the Management0 IP of each node while the containerlab network is up.
# Find the current IPs with:
#   containerlab inspect -t ~/life-os/repos/network-training/labs/02-underlay/underlay.clab.yml
#
# These IPs are assigned by containerlab's docker network and may change between
# destroy/deploy cycles. Update them here each time if they change.

fabric:
  children:
    spines:
      hosts:
        spine1:
          ansible_host: FILL_IN   # 172.20.20.x from containerlab inspect
        spine2:
          ansible_host: FILL_IN
    leaves:
      hosts:
        leaf1:
          ansible_host: FILL_IN
        leaf2:
          ansible_host: FILL_IN
        leaf3:
          ansible_host: FILL_IN
        leaf4:
          ansible_host: FILL_IN
