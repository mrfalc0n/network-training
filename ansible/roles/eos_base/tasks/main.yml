---
# eos_base: identity and routing engine.
# Sets: hostname, ip routing, routing model, spanning-tree mode.
#
# Each task uses arista.eos.eos_config with a 'lines' list —
# exactly the commands you would type in EOS configure mode.
# {{ inventory_hostname }} resolves to the node's name from inventory.
#
# NOTE: 'service routing protocols model multi-agent' requires a process
# restart to take effect. The Session 6 gate deploys from a minimal base
# that already includes it, so this is not an issue there.

- name: set hostname
  arista.eos.eos_config:
    lines:
      - "hostname {{ inventory_hostname }}"

- name: enable ip routing
  arista.eos.eos_config:
    lines:
      - "ip routing"

- name: set routing protocols model
  arista.eos.eos_config:
    lines:
      - "service routing protocols model multi-agent"

- name: set spanning-tree mode
  arista.eos.eos_config:
    lines:
      - "spanning-tree mode mstp"